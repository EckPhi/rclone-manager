name: Synology DSM test package

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RCLONE_VERSION: 1.75.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config shellcheck unzip perl make
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Check package tooling
        run: |
          python3 -m unittest discover -s synology/tests -v
          shellcheck -s sh synology/scripts/start-stop-status synology/scripts/postinst
      - name: Check native backend
        working-directory: src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --target x86_64-unknown-linux-musl --no-default-features --features native-headless -- -D warnings
          cargo test --no-default-features --features native-headless --lib
      - name: Build static native server
        working-directory: src-tauri
        run: cargo build --release --target x86_64-unknown-linux-musl --no-default-features --features native-headless
      - name: Download and verify pinned rclone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/synology/rclone
          cd dist/synology/rclone
          archive="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl --fail --location --retry 3 --output "$archive" "https://downloads.rclone.org/v${RCLONE_VERSION}/$archive"
          curl --fail --location --retry 3 --output SHA256SUMS "https://downloads.rclone.org/v${RCLONE_VERSION}/SHA256SUMS"
          awk -v archive="$archive" '$2 == archive || $2 == "*" archive { print; found=1 } END { if (!found) exit 1 }' SHA256SUMS > selected.sha256
          sha256sum --check selected.sha256
          unzip -q "$archive"
      - name: Build DSM 7 x86_64 SPK
        run: |
          python3 synology/build_spk.py \
            --arch x86_64 \
            --binary src-tauri/target/x86_64-unknown-linux-musl/release/rclone-manager \
            --rclone "dist/synology/rclone/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" \
            --output dist/synology/rclone-manager-0.3.3-2-x86_64.spk
          sha256sum dist/synology/*.spk > dist/synology/SHA256SUMS
      - name: Smoke test real Linux package
        run: sh synology/tests/smoke-linux.sh dist/synology/rclone-manager-0.3.3-2-x86_64.spk
      - uses: actions/upload-artifact@v4
        with:
          name: synology-dsm7-x86_64
          path: |
            dist/synology/*.spk
            dist/synology/SHA256SUMS
          if-no-files-found: error
